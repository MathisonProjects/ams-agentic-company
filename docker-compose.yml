version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"  # HTTP server
      - "8081:8081"  # WebSocket server
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Development service (optional)
  app-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:8080"  # HTTP server
      - "3001:8081"  # WebSocket server
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    profiles:
      - dev
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
